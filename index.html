<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="ÁGATHA — assistente pessoal de IA">

<link rel="manifest" href="./manifest.json">

<title>ÁGATHA</title>

<style>
:root{
--bg:#080b12;
--card:#111827;
--card2:#172033;
--text:#f8fafc;
--muted:#94a3b8;
--accent:#67e8f9;
--border:#243047
}

*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(circle at 50% 0,#172554 0,#080b12 42%);
color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
min-height:100vh
}

.app{
max-width:760px;
margin:auto;
min-height:100vh;
padding:20px 16px 28px;
display:flex;
flex-direction:column
}

header{
display:flex;
align-items:center;
justify-content:space-between;
padding:8px 2px 22px
}

.brand{
display:flex;
gap:12px;
align-items:center
}

.orb{
width:46px;
height:46px;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff,#67e8f9 18%,#0ea5e9 50%,#1e1b4b 100%);
box-shadow:0 0 28px #38bdf877
}

h1{
font-size:22px;
margin:0;
letter-spacing:.08em
}

.sub{
font-size:12px;
color:var(--muted);
margin-top:3px
}

.status{
font-size:12px;
color:#a7f3d0;
border:1px solid #14532d;
background:#052e16;
padding:6px 9px;
border-radius:999px
}

.install-area{
display:flex;
justify-content:center;
margin-bottom:14px
}

.install{
display:none;
width:100%;
max-width:420px;
border:1px solid #38bdf8;
background:#0ea5e9;
color:white;
border-radius:15px;
padding:13px 16px;
font-size:15px;
font-weight:600;
cursor:pointer;
box-shadow:0 0 20px #0ea5e944
}

main{
flex:1;
display:flex;
flex-direction:column;
gap:14px
}

.welcome{
padding:22px;
border:1px solid var(--border);
background:#0b1220cc;
border-radius:22px
}

.welcome h2{
margin:0 0 8px;
font-size:25px
}

.welcome p{
margin:0;
color:#cbd5e1;
line-height:1.5
}

.chat{
display:flex;
flex-direction:column;
gap:10px;
min-height:120px
}

.bubble{
max-width:88%;
padding:12px 15px;
border-radius:17px;
line-height:1.45;
font-size:15px
}

.a{
align-self:flex-start;
background:var(--card);
border:1px solid var(--border)
}

.u{
align-self:flex-end;
background:#0c4a6e
}

.composer{
display:flex;
gap:8px;
align-items:center;
margin-top:auto;
padding-top:10px
}

.composer input{
flex:1;
min-width:0;
background:var(--card);
color:var(--text);
border:1px solid var(--border);
border-radius:15px;
padding:14px;
font-size:15px;
outline:none
}

.btn{
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:15px;
padding:13px 14px;
cursor:pointer
}

.send{
background:#0ea5e9;
border-color:#38bdf8
}

.mic{
width:48px
}

footer{
text-align:center;
color:#64748b;
font-size:11px;
padding-top:16px
}

@media(max-width:430px){
.app{
padding:14px 12px 20px
}

.welcome h2{
font-size:22px
}

.bubble{
max-width:94%
}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="brand">
<div class="orb"></div>
<div>
<h1>ÁGATHA</h1>
<div class="sub">Assistente pessoal</div>
</div>
</div>

<div class="status">● pronta</div>
</header>

<div class="install-area">
<button id="installBtn" class="install">
📲 Instalar ÁGATHA
</button>
</div>

<main>

<section class="welcome">
<h2>Olá. Eu sou a ÁGATHA.</h2>
<p>
Estou pronta para organizar suas ideias, responder perguntas e acompanhar suas tarefas.
Esta é a versão instalável inicial.
</p>
</section>

<section id="chat" class="chat">
<div class="bubble a">
Como posso ajudar você agora?
</div>
</section>

<div class="composer">

<button class="btn mic" id="mic" title="Falar">
🎙️
</button>

<input
id="msg"
autocomplete="off"
placeholder="Digite sua mensagem…"
>

<button class="btn send" id="send">
Enviar
</button>

</div>

</main>

<footer>
ÁGATHA • versão 0.2 • interface PWA
</footer>

</div>

<script>

const chat=document.getElementById('chat');
const input=document.getElementById('msg');

function add(text,who){
const d=document.createElement('div');
d.className='bubble '+who;
d.textContent=text;
chat.appendChild(d);
d.scrollIntoView({
behavior:'smooth',
block:'end'
});
}

async function reply(t){

    try {

        const response = await fetch(
            "https://dawn-butterfly-00b9.felipeantonioelias.workers.dev/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: t
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            return "Desculpe, ocorreu um erro ao falar com meu cérebro de IA.";
        }

        return data.answer || "Não consegui gerar uma resposta.";

    } catch (error) {

        console.error("Erro ao conectar com a ÁGATHA:", error);

        return "Não consegui me conectar ao meu cérebro de IA.";

async function send(){

    const t=input.value.trim();

    if(!t)return;

    add(t,'u');

    input.value='';

    const resposta = await reply(t);

    add(resposta,'a');

}

document.getElementById('send').onclick=send;

input.addEventListener('keydown',e=>{
if(e.key==='Enter')send();
});

document.getElementById('mic').onclick=()=>{

if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){

add(
'O reconhecimento de voz não está disponível neste navegador.',
'a'
);

return;
}

const R=
window.SpeechRecognition||
window.webkitSpeechRecognition;

const r=new R();

r.lang='pt-BR';
r.interimResults=false;

r.onresult=e=>{
input.value=e.results[0][0].transcript;
send();
};

r.start();

};


/* ================================
   INSTALAÇÃO PWA
================================ */

let deferredPrompt=null;

const installBtn=
document.getElementById('installBtn');

window.addEventListener(
'beforeinstallprompt',
(event)=>{

event.preventDefault();

deferredPrompt=event;

installBtn.style.display='block';

}
);

installBtn.addEventListener(
'click',
async()=>{

if(!deferredPrompt){

add(
'A instalação ainda não está disponível neste momento. Tente novamente em alguns segundos.',
'a'
);

return;

}

deferredPrompt.prompt();

const {outcome}=await deferredPrompt.userChoice;

if(outcome==='accepted'){

installBtn.textContent='✓ ÁGATHA instalada';

installBtn.disabled=true;

}

deferredPrompt=null;

}
);


/* Detecta quando o aplicativo já está instalado */

window.addEventListener(
'appinstalled',
()=>{

installBtn.style.display='none';

}
);


/* Service Worker */

if('serviceWorker' in navigator){

window.addEventListener(
'load',
()=>{

navigator.serviceWorker
.register('./sw.js')
.then(()=>{
console.log('ÁGATHA: Service Worker registrado.');
})
.catch(error=>{
console.error(
'Erro ao registrar Service Worker:',
error
);
});

});

}

</script>

</body>
</html>
