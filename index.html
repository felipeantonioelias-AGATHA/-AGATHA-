<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="ÁGATHA — assistente pessoal de IA">

<link rel="manifest" href="./manifest.json">

<title>ÁGATHA</title>

<style>
:root{
--bg:#080b12;
--card:#111827;
--card2:#172033;
--text:#f8fafc;
--muted:#94a3b8;
--accent:#67e8f9;
--border:#243047
}

*{
box-sizing:border-box
}

body{
margin:0;
background:radial-gradient(circle at 50% 0,#172554 0,#080b12 42%);
color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
min-height:100vh
}

.app{
max-width:760px;
margin:auto;
min-height:100vh;
padding:20px 16px 28px;
display:flex;
flex-direction:column
}

header{
display:flex;
align-items:center;
justify-content:space-between;
padding:8px 2px 22px
}

.brand{
display:flex;
gap:12px;
align-items:center
}

.orb{
width:46px;
height:46px;
border-radius:50%;
background:radial-gradient(
circle at 35% 30%,
#fff,
#67e8f9 18%,
#0ea5e9 50%,
#1e1b4b 100%
);
box-shadow:0 0 28px #38bdf877
}

h1{
font-size:22px;
margin:0;
letter-spacing:.08em
}

.sub{
font-size:12px;
color:var(--muted);
margin-top:3px
}

.status{
font-size:12px;
color:#a7f3d0;
border:1px solid #14532d;
background:#052e16;
padding:6px 9px;
border-radius:999px
}

.install-area{
display:flex;
justify-content:center;
margin-bottom:14px
}

.install{
display:none;
width:100%;
max-width:420px;
border:1px solid #38bdf8;
background:#0ea5e9;
color:white;
border-radius:15px;
padding:13px 16px;
font-size:15px;
font-weight:600;
cursor:pointer;
box-shadow:0 0 20px #0ea5e944
}

main{
flex:1;
display:flex;
flex-direction:column;
gap:14px
}

.welcome{
padding:22px;
border:1px solid var(--border);
background:#0b1220cc;
border-radius:22px
}

.welcome h2{
margin:0 0 8px;
font-size:25px
}

.welcome p{
margin:0;
color:#cbd5e1;
line-height:1.5
}

.chat{
display:flex;
flex-direction:column;
gap:10px;
min-height:120px;
padding-bottom:10px
}

.bubble{
max-width:88%;
padding:12px 15px;
border-radius:17px;
line-height:1.45;
font-size:15px;
white-space:pre-wrap
}

.a{
align-self:flex-start;
background:var(--card);
border:1px solid var(--border)
}

.u{
align-self:flex-end;
background:#0c4a6e
}

.composer{
display:flex;
gap:8px;
align-items:center;
margin-top:auto;
padding-top:10px
}

.composer input{
flex:1;
min-width:0;
background:var(--card);
color:var(--text);
border:1px solid var(--border);
border-radius:15px;
padding:14px;
font-size:15px;
outline:none
}

.composer input:focus{
border-color:#38bdf8
}

.btn{
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:15px;
padding:13px 14px;
cursor:pointer
}

.btn:disabled{
opacity:.5;
cursor:not-allowed
}

.send{
background:#0ea5e9;
border-color:#38bdf8
}

.mic{
width:48px
}

footer{
text-align:center;
color:#64748b;
font-size:11px;
padding-top:16px
}

@media(max-width:430px){

.app{
padding:14px 12px 20px
}

.welcome h2{
font-size:22px
}

.bubble{
max-width:94%
}

.composer{
position:sticky;
bottom:0;
padding-bottom:4px
}

}
</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">

<div class="orb"></div>

<div>
<h1>ÁGATHA</h1>
<div class="sub">Assistente pessoal de IA</div>
</div>

</div>

<div class="status">● pronta</div>

</header>

<div class="install-area">

<button id="installBtn" class="install">
📲 Instalar ÁGATHA
</button>

</div>

<main>

<section class="welcome">

<h2>Olá. Eu sou a ÁGATHA.</h2>

<p>
Seu assistente pessoal de inteligência artificial.
Pergunte, converse comigo ou use sua voz.
</p>

</section>

<section id="chat" class="chat">

<div class="bubble a">
Olá! Eu sou a ÁGATHA. Como posso ajudar você?
</div>

</section>

<div class="composer">

<button
class="btn mic"
id="mic"
title="Falar"
>
🎙️
</button>

<input
id="msg"
autocomplete="off"
placeholder="Digite sua mensagem…"
>

<button
class="btn send"
id="send"
>
Enviar
</button>

</div>

</main>

<footer>
ÁGATHA • V3 • assistente pessoal de IA
</footer>

</div>

<script>

/* ================================
   CONFIGURAÇÃO
================================ */

const WORKER_URL =
"https://dawn-butterfly-00b9.felipeantonioelias.workers.dev/";


/* ================================
   ELEMENTOS
================================ */

const chat =
document.getElementById("chat");

const input =
document.getElementById("msg");

const sendButton =
document.getElementById("send");

const micButton =
document.getElementById("mic");


/* ================================
   ADICIONAR MENSAGEM
================================ */

function add(text, who){

const d =
document.createElement("div");

d.className =
"bubble " + who;

d.textContent =
text;

chat.appendChild(d);

d.scrollIntoView({
behavior:"smooth",
block:"end"
});

return d;

}


/* ================================
   CONVERSAR COM A ÁGATHA
================================ */

async function reply(message){

try{

const response =
await fetch(
WORKER_URL,
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})
}
);

const data =
await response.json();


if(!response.ok){

console.error(
"Erro retornado pelo Worker:",
data
);

return (
data.error ||
"Desculpe, ocorreu um erro ao falar com meu cérebro de IA."
);

}


/*
O Worker da ÁGATHA devolve
a resposta no campo "response".
*/

return (
data.response ||
"Não consegui gerar uma resposta."
);


}catch(error){

console.error(
"Erro ao conectar com o Worker:",
error
);

return (
"Não consegui me conectar ao meu cérebro de IA. Verifique sua conexão e tente novamente."
);

}

}


/* ================================
   ENVIAR MENSAGEM
================================ */

async function send(){

const text =
input.value.trim();

if(!text)
return;


/* Mensagem do usuário */

add(
text,
"u"
);

input.value="";


/* Desabilita enquanto pensa */

sendButton.disabled=true;
micButton.disabled=true;


/* Indicador */

const thinking =
add(
"Pensando…",
"a"
);


const response =
await reply(text);


/* Remove indicador */

thinking.remove();


/* Resposta da ÁGATHA */

add(
response,
"a"
);


/* Libera novamente */

sendButton.disabled=false;
micButton.disabled=false;

input.focus();

}


/* ================================
   BOTÃO ENVIAR
================================ */

sendButton.onclick =
send;


/* ================================
   ENTER
================================ */

input.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

send();

}

}
);


/* ================================
   RECONHECIMENTO DE VOZ
================================ */

micButton.onclick=()=>{

if(
!("webkitSpeechRecognition" in window) &&
!("SpeechRecognition" in window)
){

add(
"O reconhecimento de voz não está disponível neste navegador.",
"a"
);

return;

}


const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


const recognition =
new Recognition();


recognition.lang =
"pt-BR";

recognition.interimResults =
false;

recognition.continuous =
false;


micButton.disabled=true;

micButton.textContent="🔴";


recognition.onresult =
event=>{

input.value =
event.results[0][0].transcript;

send();

};


recognition.onerror =
event=>{

console.error(
"Erro no reconhecimento de voz:",
event.error
);

add(
"Não consegui entender sua voz. Tente novamente.",
"a"
);

};


recognition.onend =
()=>{

micButton.disabled=false;

micButton.textContent="🎙️";

};


recognition.start();

};


/* ================================
   INSTALAÇÃO PWA
================================ */

let deferredPrompt =
null;

const installBtn =
document.getElementById(
"installBtn"
);


window.addEventListener(
"beforeinstallprompt",
event=>{

event.preventDefault();

deferredPrompt =
event;

installBtn.style.display =
"block";

}
);


installBtn.addEventListener(
"click",
async()=>{

if(!deferredPrompt){

add(
"A instalação ainda não está disponível neste momento.",
"a"
);

return;

}


deferredPrompt.prompt();


const result =
await deferredPrompt.userChoice;


if(
result.outcome==="accepted"
){

installBtn.textContent =
"✓ ÁGATHA instalada";

installBtn.disabled=true;

}


deferredPrompt=null;

}
);


/* ================================
   APLICATIVO INSTALADO
================================ */

window.addEventListener(
"appinstalled",
()=>{

installBtn.style.display =
"none";

}
);


/* ================================
   SERVICE WORKER
================================ */

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./sw.js")
.then(
()=>{
console.log(
"ÁGATHA V3: Service Worker registrado."
);
}
)
.catch(
error=>{
console.error(
"Erro ao registrar Service Worker:",
error
);
}
);

});

}

</script>

</body>
</html>
